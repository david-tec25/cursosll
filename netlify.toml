# Configuración de despliegue para Netlify
[build]
  # Indica a Netlify que debe posicionarse en la carpeta frontend para compilar
  base = "frontend"
  
  # Comando de compilación dentro de la carpeta frontend
  command = "npm run build"
  
  # Carpeta de salida (Vite compila en la carpeta 'dist')
  publish = "dist"

# Redirección para la API en producción.
# REEMPLAZA la URL 'https://tu-backend-desplegado.onrender.com/api/:splat' con la URL real
# de tu backend una vez que lo tengas desplegado (por ejemplo, en Render, Railway, etc.)
[[redirects]]
  from = "/api/*"
  to = "https://tu-backend-desplegado.onrender.com/api/:splat"
  status = 200
  force = true

# Redirección para aplicaciones SPA (Single Page Application)
# Evita errores 404 al refrescar páginas en el navegador si utilizas enrutamiento del lado del cliente
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
